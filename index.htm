<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wolf Trade - Real Top</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        /* ... (все стили остаются без изменений, они длинные, я не буду их дублировать, они у тебя уже есть) ... */
        :root { --bg-main: #05070a; --bg-panel: #0f141e; --bg-header: #161c2a; --text-main: #e2e8f0; --text-muted: #64748b; --green: #00ff88; --red: #ff3366; --border: #1e293b; --gold: #fbbf24; --blue: #3b82f6; --purple: #a855f7; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        /* ... (остальные стили) ... */
        .leaderboard-row { display: flex; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid var(--border); font-size: 12px; }
        .leaderboard-row.you { background: rgba(251, 191, 36, 0.1); border-left: 3px solid var(--gold); font-weight: bold; }
        .lb-rank { color: var(--text-muted); width: 25px; }
        .lb-name { flex: 1; color: #fff; }
        .lb-money { font-weight: bold; color: var(--green); }
        /* ... (все остальные стили, включая кнопки, график и т.д.) ... */
    </style>
</head>
<body>
    <!-- ... (весь HTML код с вкладками, графиком, кнопками — остается без изменений) ... -->

    <script>
        let tg = window.Telegram ? window.Telegram.WebApp : null;
        let tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
        if (tg) tg.expand();

        const SERVER_URL = 'https://bot-server-1-tdqa.onrender.com';
        
        // ... (остальные переменные: balance, wallet и т.д.) ...

        // --- СИНХРОНИЗАЦИЯ С СЕРВЕРОМ ---
        function sendBalanceToServer() {
            if (!tgUser) return;
            fetch(`${SERVER_URL}/update_balance`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: tgUser.id, name: tgUser.first_name, balance: balance })
            }).catch(e => console.log("Ошибка синхронизации", e));
        }

        async function fetchLeaderboard() {
            try {
                const res = await fetch(`${SERVER_URL}/get_leaderboard`);
                const data = await res.json();
                renderLeaderboard(data);
            } catch (e) { console.log("Ошибка загрузки топа", e); }
        }

        function renderLeaderboard(players) {
            let html = '';
            players.forEach((p, index) => {
                let rank = index + 1;
                let medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
                let isYou = tgUser && p.name === tgUser.first_name; // Простое сравнение по имени
                html += `<div class="leaderboard-row ${isYou ? 'you' : ''}">
                    <div class="lb-rank">${medal}</div>
                    <div class="lb-name">${p.name}</div>
                    <div class="lb-money">$${Math.floor(p.balance).toLocaleString()}</div>
                </div>`;
            });
            document.getElementById('leaderboard-list').innerHTML = html;
        }

        // Вызывать sendBalanceToServer() при каждом изменении баланса (например, в updateUI)
        // ... (вставь вызов sendBalanceToServer() в функцию updateUI или после каждой сделки) ...
        
        // Загружать топ при открытии вкладки
        function switchTab(tabId, el) {
            // ... (код переключения вкладок) ...
            if (tabId === 'tab-leaderboard') fetchLeaderboard();
        }

        // ... (весь остальной JS код: торговля, реклама, кредиты, туториал и т.д.) ...
    </script>
</body>
</html>
